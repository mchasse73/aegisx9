# systemd-sysusers: static service account for the daily scan unit (needs ambient
# CAP_NET_RAW/CAP_NET_ADMIN, which DynamicUser cannot provide). Install to
# /usr/lib/sysusers.d/aegisx9-scanner.conf and run `systemd-sysusers`.
u aegisx9-scanner - "AegisX9 external vantage scanner" /var/lib/aegisx9-scanner
