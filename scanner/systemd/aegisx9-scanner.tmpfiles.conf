# systemd-tmpfiles: state and log directories for the scanner units. Install to
# /usr/lib/tmpfiles.d/aegisx9-scanner.conf and run `systemd-tmpfiles --create`.
# Group-writable so the DynamicUser units (Group=aegisx9-scanner, ReadWritePaths) can
# write their snapshots next to the daily unit's. The config directory is root-owned;
# the secret files inside it are 0600 root and reach the scan units only through
# systemd LoadCredential= (see the unit files).
d /var/lib/aegisx9-scanner 0770 aegisx9-scanner aegisx9-scanner - -
d /var/log/aegisx9-scanner 0770 aegisx9-scanner aegisx9-scanner - -
d /etc/aegisx9-scanner     0755 root root - -
