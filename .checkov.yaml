# Checkov configuration. Every skip states why.
compact: true
quiet: true
skip-check:
  # Images are pinned by digest in the overlays; the chart default tag is a local fallback.
  - CKV_K8S_43
  # Digest-pinned images are immutable, so IfNotPresent is safe and avoids registry load.
  - CKV_K8S_15
  # LiteLLM reads provider keys from environment variables (os.environ/<NAME>); the
  # Secret is managed by External Secrets and never rendered into manifests.
  - CKV_K8S_35
  # promote-prod.yml takes a digest input by design: it does not build anything, it
  # validates the digest format, verifies its signature, and opens a reviewed PR.
  - CKV_GHA_7
  # Single-maintainer project: one CODEOWNERS approval is the maximum possible.
  - CKV_GIT_5
  # Commit signing is tracked as a Phase 1 issue; enabling it before maintainers have
  # signing keys configured would block all merges.
  - CKV_GIT_6
