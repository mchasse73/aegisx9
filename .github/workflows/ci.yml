# Pull-request and push pipeline. Runs ONLY on GitHub-hosted runners.
# Never add a self-hosted runner (runs-on: aegisx9-arc) to this workflow: it runs PR code.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  HELM_VERSION: "v3.21.2"
  SEMGREP_VERSION: "1.182.0"
  PIP_AUDIT_VERSION: "2.10.1"
  TERRAFORM_VERSION: "1.15.5"
  TFLINT_VERSION: "v0.64.0"
  SENTINEL_VERSION: "0.41.0"
  ANSIBLE_LINT_VERSION: "26.10.1"

jobs:
  lint-test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check --output-format=github . && ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest (coverage gate in pyproject.toml)
        run: pytest --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  identifier-check:
    name: identifier check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: no internal identifiers in tracked files
        env:
          # Optional extra patterns from a repository secret; empty on forks. Never printed.
          AEGISX9_EXTRA_IDENTIFIER_PATTERNS: ${{ secrets.INTERNAL_IDENTIFIER_PATTERNS }}
        run: python3 scripts/ci/check_identifiers.py

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "semgrep==${SEMGREP_VERSION}"
      - name: semgrep scan
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/secrets --config p/dockerfile
          --config p/github-actions --config p/kubernetes

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: audit runtime requirements
        # Documented exceptions only: every entry in .trivyignore carries its reason and
        # re-evaluation trigger.
        run: |
          ignores=()
          while read -r id; do ignores+=(--ignore-vuln "${id}"); done < <(grep -vE '^\s*(#|$)' .trivyignore)
          pip-audit --strict -r requirements/runtime.txt "${ignores[@]}"
      - name: audit dev requirements
        run: pip-audit --strict .

  iac:
    name: helm lint, Checkov, kube-linter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: helm lint --strict deploy/helm/aegisx9
      - name: render chart and overlays
        run: |
          mkdir -p rendered
          helm template aegisx9 deploy/helm/aegisx9 --namespace aegisx9-ci > rendered/chart.yaml
          for env in staging prod; do
            kubectl kustomize --enable-helm "deploy/overlays/${env}" > "rendered/${env}.yaml"
          done
          cp policies/kyverno/*.yaml rendered/
      - uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: rendered
          framework: kubernetes
          config_file: .checkov.yaml
      # One step per framework: the action's `framework` input takes a single value.
      - uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          framework: dockerfile
          config_file: .checkov.yaml
      - uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: .
          framework: github_actions
          config_file: .checkov.yaml
      - uses: stackrox/kube-linter-action@87802a2f4e01abebb3ee3c67a3002fea71f6eae5 # v1.0.7
        with:
          directory: rendered
          config: .kube-linter.yaml

  image:
    name: docker build + Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: aegisx9:ci-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: proxy boots with the guard loaded (smoke test, without and with a database)
        env:
          IMG: aegisx9:ci-${{ github.sha }}
          # Official postgres:17.11 image, pinned by digest. Started as a step container, not
          # a job service: services start before any step, so a password generated at
          # runtime could not reach them, and a literal one would sit in the repository.
          PG_IMG: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        run: |
          set -euo pipefail
          # Render the real chart config, then start the proxy offline with throwaway
          # credentials generated here; the guard callback must load and /health/liveliness
          # must answer. No provider is called. The container runs as in the cluster:
          # non-root, read-only root filesystem, HOME and the only writable path on /tmp.
          helm template ci deploy/helm/aegisx9 --set gateway.otel.enabled=false --set gateway.oidc.enabled=false \
            --show-only templates/configmap.yaml \
            | python3 -c 'import sys,yaml; print(yaml.safe_load(sys.stdin)["data"]["config.yaml"])' > "${RUNNER_TEMP}/config.yaml"
          rnd() { python3 -c 'import secrets; print(secrets.token_urlsafe(24))'; }
          umask 077
          printf 'LITELLM_MASTER_KEY=sk-%s\nAEGIS_PRINCIPAL_SALT=%s\nOPENAI_API_KEY=%s\nANTHROPIC_API_KEY=%s\nHOME=/tmp\n' \
            "$(rnd)" "$(rnd)" "unused" "unused" > "${RUNNER_TEMP}/smoke.env"

          logs() {
            echo "last log lines of $1:"
            docker logs "$1" 2>&1 | tail -n 40 | grep -viE 'key|token|secret|password|postgres(ql)?://' || true
          }
          # boot <name> <port> <timeout s> <docker run args...>: start the gateway and wait
          # for /health/liveliness; fail with filtered logs if it exits or never answers.
          boot() {
            local name="$1" port="$2" timeout="$3"; shift 3
            docker run -d --name "${name}" --read-only --tmpfs /tmp:rw,size=256m \
              --env-file "${RUNNER_TEMP}/smoke.env" "$@" \
              -v "${RUNNER_TEMP}/config.yaml:/etc/aegisx9/config.yaml:ro" "${IMG}" \
              --config /etc/aegisx9/config.yaml --port "${port}" >/dev/null
            local deadline=$((SECONDS + timeout))
            while [ "${SECONDS}" -lt "${deadline}" ]; do
              if curl -fsS --max-time 2 "http://127.0.0.1:${port}/health/liveliness" >/dev/null 2>&1; then
                echo "${name}: proxy is up with the guard loaded"; return 0
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' "${name}")" != "true" ]; then break; fi
              sleep 2
            done
            echo "${name}: proxy did not start"; logs "${name}"; return 1
          }
          # unauth <name> <port> <labels...>: a call without valid credentials must be refused
          # with 401, never a 5xx from an exception in the auth path (#68). Labels: none (no
          # header), empty (empty bearer), random (a random bearer generated here; needs the
          # database, without one LiteLLM can't look the key up and answers 400).
          unauth() {
            local name="$1" port="$2" code label; shift 2
            for label in "$@"; do
              case "${label}" in
                none) code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                  "http://127.0.0.1:${port}/v1/models") || true ;;
                empty) code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                  -H 'Authorization: Bearer ' "http://127.0.0.1:${port}/v1/models") || true ;;
                random) code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                  -H "Authorization: Bearer $(rnd)" "http://127.0.0.1:${port}/v1/models") || true ;;
              esac
              [ "${code}" = "401" ] || {
                echo "${name}: /v1/models with ${label} credentials returned ${code}, expected 401"
                logs "${name}"; return 1
              }
            done
            echo "${name}: unauthenticated /v1/models is refused with 401"
          }
          cleanup() { docker rm -f smoke smoke-db smoke-pg >/dev/null 2>&1 || true; rm -f "${RUNNER_TEMP}"/*.env; }
          trap cleanup EXIT

          # 1. No database.
          boot smoke 4000 90 -p 4000:4000
          unauth smoke 4000 none empty
          docker rm -f smoke >/dev/null

          # 2. The Prisma toolchain is baked: it runs with no network at all.
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m -e HOME=/tmp \
            --entrypoint sh "${IMG}" -c '"${PRISMA_CLI_PATH}" --version >/dev/null && prisma --version >/dev/null' \
            || { echo "prisma CLI does not run offline"; exit 1; }
          echo "prisma CLI runs offline"

          # 3. With Postgres: LiteLLM applies its migrations at startup, then serves.
          pg_password="$(rnd)"
          printf 'POSTGRES_USER=aegisx9\nPOSTGRES_DB=aegisx9\nPOSTGRES_PASSWORD=%s\n' "${pg_password}" > "${RUNNER_TEMP}/pg.env"
          docker run -d --name smoke-pg -p 127.0.0.1:5432:5432 --env-file "${RUNNER_TEMP}/pg.env" "${PG_IMG}" >/dev/null
          for _ in $(seq 1 30); do
            docker exec smoke-pg pg_isready -q -h 127.0.0.1 -U aegisx9 -d aegisx9 && break
            sleep 2
          done
          docker exec smoke-pg pg_isready -q -h 127.0.0.1 -U aegisx9 -d aegisx9
          printf 'DATABASE_URL=postgresql://aegisx9:%s@127.0.0.1:5432/aegisx9\n' "${pg_password}" >> "${RUNNER_TEMP}/smoke.env"
          unset pg_password
          boot smoke-db 4001 300 --network host
          applied="$(docker exec smoke-pg psql -qtAX -U aegisx9 -d aegisx9 \
            -c 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL')"
          echo "LiteLLM migrations applied: ${applied}"
          [ "${applied}" -gt 0 ] || { logs smoke-db; exit 1; }
          unauth smoke-db 4001 none empty random
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegisx9:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  workspace-image:
    name: workspace image build + Trivy + container self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workspace
          file: workspace/image/Dockerfile
          load: true
          push: false
          tags: aegisx9-workspace:ci-${{ github.sha }}
          # CI renders the baseline with example hosts; the release build uses the
          # repository variables (see workspace/README.md).
          build-args: |
            VERSION=${{ github.sha }}
            AEGISX9_GATEWAY_URL=https://gateway.example.test
            AEGISX9_OTLP_ENDPOINT=https://otlp.example.test
            AEGISX9_VAULT_ADDR=https://vault.example.test
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegisx9-workspace:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: workspace/image/.trivyignore
      - name: container self-test (locked baseline, non-root, no static key)
        env:
          IMG: aegisx9-workspace:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          failed=0
          run() { docker run --rm "${IMG}" "$@"; }
          # check <name> <command...>: every check runs even after a failure, and the
          # job fails at the end naming each one that did not pass.
          check() {
            local name="$1"; shift
            if "$@"; then echo "ok   ${name}"; else echo "FAIL ${name}"; failed=1; fi
          }
          managed_root_0644() { [ "$(run stat -c '%U:%G %a' "$1")" = "root:root 644" ]; }
          user_is_dev() { [ "$(run id -u)" = "1000" ] && [ "$(run id -un)" = "dev" ]; }
          no_static_key() {
            [ -z "$(run sh -c 'printf "%s%s" "${ANTHROPIC_API_KEY:-}" "${ANTHROPIC_AUTH_TOKEN:-}"')" ]
          }

          # The image's own self-test, then the same facts asserted from outside.
          check selftest run /opt/aegisx9/bin/workspace-selftest
          check managed-settings-perms managed_root_0644 /etc/claude-code/managed-settings.json
          check managed-mcp-perms managed_root_0644 /etc/claude-code/managed-mcp.json
          check user-dev-1000 user_is_dev
          check no-sudo run sh -c '! command -v sudo >/dev/null 2>&1 && ! test -e /etc/sudoers && ! id -nG | grep -qw sudo'
          check managed-settings-readonly run sh -c 'touch /etc/claude-code/managed-settings.json 2>/dev/null && exit 1 || exit 0'
          check claude-version run claude --version
          check no-static-key no_static_key
          check settings-content run python3 -c 'import json; s=json.load(open("/etc/claude-code/managed-settings.json")); assert s["apiKeyHelper"]=="/opt/aegisx9/bin/gateway-token"; assert s["env"]["ANTHROPIC_BASE_URL"]=="https://gateway.example.test"; assert s["sandbox"]["enabled"] is True'
          # Hooks work inside the image (regex-only prompt check, fail-closed paths intact).
          check prompt-hook-allows run sh -c 'printf "%s" "{\"prompt\":\"refactor the parser\"}" | /opt/aegisx9/hooks/prompt-credential-check.sh'
          check bash-guard-blocks run sh -c 'printf "%s" "{\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"printenv\"}}" | /opt/aegisx9/hooks/pretooluse-guard.sh; rc=$?; [ "$rc" -eq 2 ]'
          # Home initialisation: explicit (what the Coder startup script can call) and via a login shell.
          check workspace-init run bash -c '. /opt/aegisx9/bin/workspace-init && test -L "$HOME/.claude/skills/handoff" && test -d "$HOME/.aegisx9/handoff"'
          check login-shell-init run bash -lc 'test -L "$HOME/.claude/skills/handoff" && test -d "$HOME/.aegisx9/handoff"'
          check handoff-cli run handoff --help
          # Coder template requirements: sshd (unprivileged, started by the agent), rsync, pgrep.
          check coder-tools run sh -c 'test -x /usr/sbin/sshd && rsync --version >/dev/null && pgrep --version >/dev/null'
          check no-baked-host-keys run sh -c 'test ! -e /etc/ssh/ssh_host_ed25519_key'
          [ "${failed}" -eq 0 ] || { echo "workspace image self-test FAILED (see FAIL lines above)"; exit 1; }
          echo "workspace image self-test passed"

  terraform:
    name: terraform fmt, validate, tflint, Checkov
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate (no backend; TFE is never contacted from GitHub)
        run: |
          for root in infra/staging infra/prod infra/workspaces/coder-template infra/scanner; do
            terraform -chdir="${root}" init -backend=false -input=false
            terraform -chdir="${root}" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # rate limit for plugin download only
        run: |
          tflint --init
          tflint --recursive --format compact
      - uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml
          download_external_modules: false

  sentinel:
    name: sentinel test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install sentinel (checksum-verified)
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/sentinel/${SENTINEL_VERSION}"
          zip="sentinel_${SENTINEL_VERSION}_linux_amd64.zip"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/sentinel_${SENTINEL_VERSION}_SHA256SUMS"
          grep " ${zip}$" "sentinel_${SENTINEL_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -q "${zip}" -d "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: sentinel fmt + test
        working-directory: policies/sentinel
        run: |
          sentinel fmt -check=true *.sentinel
          sentinel test -verbose

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}"
      - name: install pinned collections outside the source tree
        run: ansible-galaxy collection install -r collections/requirements.yml -p "${RUNNER_TEMP}/collections"
      - name: ansible-lint (production profile)
        run: |
          ANSIBLE_COLLECTIONS_PATH="${PWD}/automation/collections:${RUNNER_TEMP}/collections" \
            ansible-lint --offline
