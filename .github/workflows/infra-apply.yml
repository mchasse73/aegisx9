# Applies infra/ through Terraform Enterprise (CLI-driven runs; Sentinel runs in TFE).
# TFE is internal, so this runs on the in-cluster ARC runners.
#
# SECURITY: self-hosted ARC runner. push-to-main and manual dispatch only, guarded `if:`,
# protected environments with required reviewers. Never add a pull_request trigger.
# Pull requests get fmt/validate/tflint/Checkov/Sentinel tests on GitHub-hosted runners
# (ci.yml) instead. See SECURITY.md "CI runner policy".
name: infra-apply

on:
  push:
    branches: [main]
    paths: ["infra/**", "policies/sentinel/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-apply
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.15.5"

jobs:
  staging:
    if: >-
      github.repository == 'mchasse73/aegisx9'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: aegisx9-arc
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: mask internal values in the public log
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          VALUE: ${{ vars.TF_CLOUD_HOSTNAME }}
        with:
          script: |
            if (process.env.VALUE) core.setSecret(process.env.VALUE);
      - name: apply via TFE (aegisx9-staging)
        env:
          TF_CLOUD_HOSTNAME: ${{ vars.TF_CLOUD_HOSTNAME }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          set -euo pipefail
          export "TF_TOKEN_${TF_CLOUD_HOSTNAME//./_}=${TFE_TOKEN}"
          unset TFE_TOKEN
          # Logs are public once the repository is: keep plan bodies in Terraform Enterprise
          # and print only the run identifier, the apply summary and errors, with internal
          # identifiers masked.
          terraform -chdir=infra/staging init -input=false 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env TF_CLOUD_HOSTNAME --terraform-summary
          terraform -chdir=infra/staging apply -input=false -auto-approve 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env TF_CLOUD_HOSTNAME --terraform-summary

  prod:
    needs: [staging]
    if: >-
      github.repository == 'mchasse73/aegisx9'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: aegisx9-arc
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: mask internal values in the public log
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          VALUE: ${{ vars.TF_CLOUD_HOSTNAME }}
        with:
          script: |
            if (process.env.VALUE) core.setSecret(process.env.VALUE);
      - name: apply via TFE (aegisx9-prod)
        env:
          TF_CLOUD_HOSTNAME: ${{ vars.TF_CLOUD_HOSTNAME }}
          TFE_TOKEN: ${{ secrets.TFE_TOKEN }}
        run: |
          set -euo pipefail
          export "TF_TOKEN_${TF_CLOUD_HOSTNAME//./_}=${TFE_TOKEN}"
          unset TFE_TOKEN
          # Logs are public once the repository is: keep plan bodies in Terraform Enterprise
          # and print only the run identifier, the apply summary and errors, with internal
          # identifiers masked.
          terraform -chdir=infra/prod init -input=false 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env TF_CLOUD_HOSTNAME --terraform-summary
          terraform -chdir=infra/prod apply -input=false -auto-approve 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env TF_CLOUD_HOSTNAME --terraform-summary
