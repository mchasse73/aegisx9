# Guard evaluation (refs #198, ADR 0024): scores the input guards, and optionally Hugging Face
# prompt-injection classifiers, against garak's target and hold-out probes and the
# false-positive corpora. GitHub-hosted runners only: it runs PR code, so never add a
# self-hosted runner here.
#
# - pull_request (guard, hook, pipeline, promptfoo attack or eval changes): heuristics only,
#   no environment, no secrets. The job fails if a target family drops below 100% or its
#   prompt count differs from ADR 0024's, if any false-positive corpus is hit, or if the word
#   list isn't the pinned one (the false-positive results are then invalid). A hold-out count
#   that differs is a warning, shown in the summary.
# - workflow_dispatch: the same heuristics job (run once; it uploads per-prompt verdicts, no
#   text), plus one report-only job per model in `models` and runtime in `runtimes` (#211, #213),
#   which uses those verdicts for the "OR heuristics" figures. Model jobs run in the
#   `guard-eval` environment (main only, in Terraform), whose HF_TOKEN secret reaches only the
#   download step, through env. Without a token a gated model is skipped with a warning; any
#   other download failure fails the job. A final report-only job compares the runtimes of
#   each model (rate deltas and the share of block decisions that differ).
#
# The sets (attack text) stay on the runner; only JSON summaries and verdicts are uploaded,
# and no step prints prompt text.
name: guard-eval

on:
  pull_request:
    branches: [main]
    paths:
      - src/aegisx9/guards/**
      - src/aegisx9/pipeline.py
      - src/aegisx9/litellm_hooks.py
      - redteam/eval/**
      - redteam/promptfoo/attacks/**
      - .github/workflows/guard-eval.yml
  workflow_dispatch:
    inputs:
      models:
        description: >-
          Models to score, newline- or comma-separated model_id@revision:label (label = the
          injection class name or index). Empty = heuristics only.
        required: false
        default: ""
      runtimes:
        description: >-
          Classifier runtimes, comma-separated: torch-fp32 (the published weights),
          onnx-fp32 (exported to ONNX, unquantised, onnxruntime on CPU) and/or onnx-int8 (the
          same export with dynamic int8, per-channel MatMul/Gemm weights: the sidecar's
          candidate runtime). Each model x runtime is its own job.
        required: false
        default: "torch-fp32,onnx-fp32,onnx-int8"

permissions:
  contents: read

concurrency:
  group: guard-eval-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  GARAK_VERSION: "0.17.1"
  TORCH_VERSION: "2.15.0" # CPU build, as in redteam-staging.yml (#184)
  # onnx-fp32 and onnx-int8 jobs only (#211, #213): torch's default ONNX exporter needs
  # onnxscript (and onnx-ir).
  ONNX_VERSION: "1.23.2"
  ONNXSCRIPT_VERSION: "0.7.2"
  ONNX_IR_VERSION: "1.1.0"
  ONNXRUNTIME_VERSION: "1.31.1"

jobs:
  heuristics:
    name: heuristics vs ADR 0024
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The word list ADR 0024 measured with; its sha256 is pinned in build_sets.py, and the
      # gate fails if it differs.
      - name: install the word list
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
      # A tool venv: garak (and its torch) never enter the gateway's or the unit tests'
      # dependencies. CPU torch first so pip keeps it when it resolves garak.
      - name: install eval tools
        timeout-minutes: 20
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/eval"
          pip="${RUNNER_TEMP}/eval/bin/pip"
          "$pip" install -q --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          "$pip" install -q "garak==${GARAK_VERSION}"
          "$pip" install -q --no-deps -e .
          if "$pip" list 2>/dev/null | grep -qi '^nvidia-'; then
            echo "::error::CUDA wheels were installed; the CPU torch pin no longer holds"
            exit 1
          fi
      - name: build the sets
        run: >-
          "${RUNNER_TEMP}/eval/bin/python" -m redteam.eval.build_sets
          --out "${RUNNER_TEMP}/sets"
      - name: score the heuristics (gate)
        run: >-
          mkdir -p "${RUNNER_TEMP}/guard-eval" "${RUNNER_TEMP}/heuristic-outcomes" &&
          "${RUNNER_TEMP}/eval/bin/python" -m redteam.eval.score run
          --sets "${RUNNER_TEMP}/sets" --heuristics --gate
          --out "${RUNNER_TEMP}/guard-eval/summary-heuristics.json"
          --outcomes-out "${RUNNER_TEMP}/heuristic-outcomes/outcomes.json"
          --markdown "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guard-eval-heuristics
          path: ${{ runner.temp }}/guard-eval/
          if-no-files-found: ignore
          retention-days: 30
      # Per-prompt verdicts keyed by set/family/index (no text), for the model jobs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: guard-eval-heuristic-outcomes
          path: ${{ runner.temp }}/heuristic-outcomes/
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: plan model jobs
    if: github.event_name == 'workflow_dispatch' && inputs.models != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The inputs reach the script through env only, never interpolated into the shell;
      # score.py validates every spec against model_id@revision:label and every runtime
      # against the known ones. Captured first, so a bad input fails this job instead of
      # writing an empty matrix.
      - id: plan
        shell: bash
        env:
          MODELS: ${{ inputs.models }}
          RUNTIMES: ${{ inputs.runtimes }}
        run: |
          out=$(python -m redteam.eval.score plan) || exit 1
          echo "matrix=${out}" >> "$GITHUB_OUTPUT"

  model:
    name: classifier ${{ matrix.model.spec }} [${{ matrix.model.runtime }}]
    needs: [plan, heuristics]
    # Report-only: runs even when the heuristics gate failed, as long as its verdicts exist.
    if: >-
      !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.matrix != '[]'
      && (needs.heuristics.result == 'success' || needs.heuristics.result == 'failure')
    runs-on: ubuntu-24.04
    environment: guard-eval
    # deberta-v3-base took 4 h with torch fp32 (run 43078992659); the hosted ceiling is 360.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install the word list
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
      # garak builds the sets and brings transformers and huggingface_hub at the versions it
      # pins against. The gateway package isn't installed: no heuristic pass runs here.
      # The ONNX jobs add the pinned exporter and runtime; torch-fp32 jobs stay as before.
      - name: install eval tools
        timeout-minutes: 20
        shell: bash
        env:
          RUNTIME: ${{ matrix.model.runtime }}
        run: |
          python -m venv "${RUNNER_TEMP}/eval"
          pip="${RUNNER_TEMP}/eval/bin/pip"
          "$pip" install -q --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          "$pip" install -q "garak==${GARAK_VERSION}"
          if [ "${RUNTIME}" = "onnx-fp32" ] || [ "${RUNTIME}" = "onnx-int8" ]; then
            "$pip" install -q "onnx==${ONNX_VERSION}" "onnxscript==${ONNXSCRIPT_VERSION}" \
              "onnx-ir==${ONNX_IR_VERSION}" "onnxruntime==${ONNXRUNTIME_VERSION}"
          fi
          if "$pip" list 2>/dev/null | grep -qi '^nvidia-'; then
            echo "::error::CUDA wheels were installed; the CPU torch pin no longer holds"
            exit 1
          fi
      - name: build the sets
        run: >-
          "${RUNNER_TEMP}/eval/bin/python" -m redteam.eval.build_sets
          --out "${RUNNER_TEMP}/sets"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: guard-eval-heuristic-outcomes
          path: ${{ runner.temp }}/heuristic-outcomes
      # The only step that sees HF_TOKEN (an environment secret), and only through env. It
      # is never echoed; an unset secret is an empty string, which is unset here so the hub
      # client goes anonymous. No token + 401/403 = skipped with a warning; any other failure
      # (bad revision, a token without licence access, 429, 5xx) fails the job.
      - name: download the model
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_SPEC: ${{ matrix.model.spec }}
        run: |
          [ -n "${HF_TOKEN}" ] || unset HF_TOKEN
          "${RUNNER_TEMP}/eval/bin/python" -m redteam.eval.score download \
            --model "${MODEL_SPEC}" --cache-dir "${RUNNER_TEMP}/models"
      # Report-only: the numbers don't fail the job; only a crash does. The ONNX runtimes
      # export the downloaded weights offline in the work dir, and onnx-int8 quantises them
      # there (not uploaded: the summary carries their sha256). The scores file holds per-prompt scores keyed by
      # set/family/index, no text, for the runtime comparison.
      - name: score the model
        env:
          HF_HUB_OFFLINE: "1"
          MODEL_SLUG: ${{ matrix.model.slug }}
          RUNTIME: ${{ matrix.model.runtime }}
          ARTIFACT: ${{ matrix.model.artifact }}
        run: >-
          mkdir -p "${RUNNER_TEMP}/guard-eval" &&
          "${RUNNER_TEMP}/eval/bin/python" -m redteam.eval.score run
          --sets "${RUNNER_TEMP}/sets"
          --heuristic-outcomes "${RUNNER_TEMP}/heuristic-outcomes/outcomes.json"
          --model-dir "${RUNNER_TEMP}/models/${MODEL_SLUG}"
          --runtime "${RUNTIME}"
          --work-dir "${RUNNER_TEMP}/onnx"
          --out "${RUNNER_TEMP}/guard-eval/summary-${ARTIFACT}.json"
          --scores-out "${RUNNER_TEMP}/guard-eval/scores-${ARTIFACT}.json"
          --markdown "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guard-eval-model-${{ matrix.model.artifact }}
          path: ${{ runner.temp }}/guard-eval/
          if-no-files-found: ignore
          retention-days: 30

  compare:
    name: runtime agreement
    needs: [plan, model]
    # Report-only, after every model job (whatever its result); reads only JSON summaries
    # and score files (no prompt text), with no environment and no secrets.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true # no model job uploaded anything: compare says so
        with:
          pattern: guard-eval-model-*
          merge-multiple: true
          path: ${{ runner.temp }}/results
      - name: compare runtimes
        run: >-
          mkdir -p "${RUNNER_TEMP}/results" &&
          python -m redteam.eval.score compare "${RUNNER_TEMP}/results"
          --markdown "${GITHUB_STEP_SUMMARY}"
