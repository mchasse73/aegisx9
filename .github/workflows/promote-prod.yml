# Opens the production promotion PR. Runs on GitHub-hosted runners; the PR changes only
# deploy/overlays/prod, which CODEOWNERS and branch protection gate on owner approval.
name: promote-prod

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest (sha256:...) already running in staging"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mchasse73/aegisx9
  SIGNER_IDENTITY: https://github.com/mchasse73/aegisx9/.github/workflows/release.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  open-promotion-pr:
    if: github.repository == 'mchasse73/aegisx9' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: validate input
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid digest"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: verify signature from main
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null
      - name: open PR
        env:
          DIGEST: ${{ inputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="promote/prod-${DIGEST:7:12}"
          git switch -c "${branch}"
          sed -i -E "s|^(\s*digest:\s*).*$|\1${DIGEST}|" deploy/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(prod): promote ${DIGEST:0:19}"
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" \
            --title "deploy(prod): promote ${DIGEST:0:19}" \
            --body "Promotes \`${IMAGE}@${DIGEST}\` to aegisx9-prod. Signature verified against the main release workflow. Requires owner approval."
