# Build once on main, sign keylessly, push to GHCR. Tags only re-tag an image that was
# already built and signed on main, so the digest (and its signature) never changes.
# GitHub-hosted runners only.
name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mchasse73/aegisx9
  WORKSPACE_IMAGE: ghcr.io/mchasse73/aegisx9/workspace
  SIGNER_IDENTITY: https://github.com/mchasse73/aegisx9/.github/workflows/release.yml@refs/heads/main
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-sign-push:
    name: build, SBOM, scan, sign, push
    if: github.ref == 'refs/heads/main' && github.repository == 'mchasse73/aegisx9'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (Sigstore OIDC) and provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=main
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (pushed digest)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Syft SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          syft-version: v1.55.0
      - name: cosign sign + attest SBOM (keyless)
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        # cosign v3 defaults to the Sigstore bundle format stored as an OCI referrer and
        # writes no legacy sha256-<digest>.sig tag. The cluster's Kyverno keyless verifier
        # reads the legacy tag, so sign in the legacy layout (still keyless, still Rekor).
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "${REF}"
          cosign attest --yes --new-bundle-format=false --use-signing-config=false \
            --type spdxjson --predicate sbom.spdx.json "${REF}"
          cosign verify "${REF}" \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null
      # GitHub artifact attestations are not available on user-owned private repositories;
      # the step turns on by itself once the repository is public. Keyless cosign signing
      # and the SBOM attestation above run regardless.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${DIGEST}" > digest.txt
          {
            echo "### Published"
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Promote to staging/prod by changing the overlay's \`images[].digest\`."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest
          path: digest.txt
          retention-days: 30

  workspace-build-sign-push:
    name: workspace image, SBOM, scan, sign, push
    # The baseline needs the company's gateway, OTLP and Vault hosts (repository
    # variables, not secrets). Until they are set the job is skipped, never built with
    # placeholders. See workspace/README.md.
    if: >-
      github.ref == 'refs/heads/main' && github.repository == 'mchasse73/aegisx9'
      && vars.AEGISX9_GATEWAY_URL != '' && vars.AEGISX9_OTLP_ENDPOINT != ''
      && vars.AEGISX9_VAULT_ADDR != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WORKSPACE_IMAGE }}
          tags: |
            type=sha
            type=sha,format=long
            type=raw,value=main
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: workspace
          file: workspace/image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            AEGISX9_ENVIRONMENT=${{ vars.AEGISX9_ENVIRONMENT || 'staging' }}
            AEGISX9_GATEWAY_URL=${{ vars.AEGISX9_GATEWAY_URL }}
            AEGISX9_OTLP_ENDPOINT=${{ vars.AEGISX9_OTLP_ENDPOINT }}
            AEGISX9_VAULT_ADDR=${{ vars.AEGISX9_VAULT_ADDR }}
            AEGISX9_MODELS=${{ vars.AEGISX9_MODELS }}
            AEGISX9_DENIED_MODELS=${{ vars.AEGISX9_DENIED_MODELS }}
            AEGISX9_SANDBOX_DOMAINS=${{ vars.AEGISX9_SANDBOX_DOMAINS }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
      - name: Trivy scan (pushed digest)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WORKSPACE_IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: workspace/image/.trivyignore
      - name: Syft SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.WORKSPACE_IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: workspace-sbom.spdx.json
          artifact-name: workspace-sbom.spdx.json
          upload-artifact: true
          syft-version: v1.55.0
      - name: cosign sign + attest SBOM (keyless)
        env:
          REF: ${{ env.WORKSPACE_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REF}"
          cosign attest --yes --type spdxjson --predicate workspace-sbom.spdx.json "${REF}"
          cosign verify "${REF}" \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null
      - name: record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${DIGEST}" > workspace-digest.txt
          {
            echo "### Published workspace image"
            echo "\`${WORKSPACE_IMAGE}@${DIGEST}\`"
            echo
            echo "Pin it in the Coder workspace template by digest."
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-image-digest
          path: workspace-digest.txt
          retention-days: 30

  tag-release:
    name: re-tag signed main image for a version tag
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'mchasse73/aegisx9'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: verify main signatures, then add version tags
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          # The workspace image only exists once its repository variables are set.
          for image in "${IMAGE}" "${WORKSPACE_IMAGE}"; do
            src="${image}:sha-${SHA}"
            if [ "${image}" = "${WORKSPACE_IMAGE}" ] \
               && ! docker buildx imagetools inspect "${src}" > /dev/null 2>&1; then
              echo "No workspace image for ${SHA}; skipping" >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi
            cosign verify "${src}" \
              --certificate-identity "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" > /dev/null
            docker buildx imagetools create \
              --tag "${image}:${ver}" \
              --tag "${image}:${ver%.*}" \
              "${src}"
            echo "Tagged ${src} as ${ver} and ${ver%.*}" >> "${GITHUB_STEP_SUMMARY}"
          done
