# Continuous red-team gate against STAGING.
#
# SECURITY: this workflow runs on self-hosted, ephemeral ARC runners inside the homelab
# k3s cluster (label aegisx9-arc). It must NEVER run code from a pull request or a fork:
#   - no pull_request / pull_request_target trigger (do not add one);
#   - the job has an `if:` guard requiring this repository, refs/heads/main and a push,
#     schedule or workflow_dispatch event;
#   - the job targets the `redteam` environment, whose deployment-branch rule allows only
#     main. It has no required reviewer, so the daily run can start on its own (owner
#     2026-11-03, #147); it holds no stored gateway key (see get_token.py).
# See SECURITY.md "CI runner policy".
#
# What it tests: the image the staging overlay on main pins, once Argo CD runs it. It used
# to wait for every release digest, which staging never runs (it moves only by a pin PR).
name: redteam-staging

on:
  push:
    branches: [main]
    paths:
      - deploy/overlays/staging/**
      - redteam/**
      - .github/workflows/redteam-staging.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redteam-staging
  cancel-in-progress: false

env:
  PROMPTFOO_VERSION: "0.124.1"
  GARAK_VERSION: "0.17.1"
  TORCH_VERSION: "2.15.0" # CPU build, see the install step (#184)

jobs:
  redteam:
    name: garak + promptfoo vs staging
    if: >-
      github.repository == 'mchasse73/aegisx9'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push'
          || github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch')
    runs-on: aegisx9-arc
    environment: redteam
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the job's own OIDC token is its identity-provider credential
    env:
      AEGIS_STAGING_URL: ${{ secrets.AEGIS_STAGING_URL }} # a secret, not a variable: masked from the first log line
      AEGISX9_EXTRA_IDENTIFIER_PATTERNS: ${{ secrets.INTERNAL_IDENTIFIER_PATTERNS }}
      AEGIS_REDTEAM_MODEL: ${{ vars.AEGIS_REDTEAM_MODEL || 'claude-haiku-5-5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The ARC runner image ships without Node (#150); promptfoo runs through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Third-party tools are fetched before any token exists, and every step that runs them
      # unsets GitHub's OIDC request variables, so a compromised dependency can neither read
      # the identity-provider settings nor mint its own assertion.
      # garak depends on torch. From PyPI that pulls about 2 GB of CUDA wheels, which once took
      # the whole hour on a slow mirror (#184), and the red-team never uses a GPU. The CPU
      # build (about 200 MB) is installed first, so pip keeps it when it resolves garak.
      - name: install promptfoo and garak
        shell: bash
        timeout-minutes: 25 # 14 minutes on a slow night (#186)
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          npx --yes "promptfoo@${PROMPTFOO_VERSION}" --version
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          pip install "garak==${GARAK_VERSION}"
          if pip list 2>/dev/null | grep -qi '^nvidia-'; then
            echo "::error::CUDA wheels were installed; the CPU torch pin no longer holds"
            exit 1
          fi
      - name: wait for staging to run the pinned digest
        run: >-
          python3 redteam/wait_for_rollout.py --namespace aegisx9-staging
          --overlay deploy/overlays/staging/kustomization.yaml --timeout 1200
      # Each suite gets its own token: tokens live at most 15 minutes, and the key the
      # gateway mints from one expires with it. get_token.py refuses a token that would not
      # outlive the suite's 12-minute cap. The identity-provider settings are secrets (they
      # name internal endpoints) and exist only in these two steps.
      - name: gateway token for promptfoo
        env:
          AEGIS_RT_TOKEN_URL: ${{ secrets.AEGIS_RT_TOKEN_URL }}
          AEGIS_RT_CLIENT_ID: ${{ secrets.AEGIS_RT_CLIENT_ID }}
          AEGIS_RT_ASSERTION_AUDIENCE: ${{ secrets.AEGIS_RT_ASSERTION_AUDIENCE }}
          AEGIS_RT_CLIENT_SECRET: ${{ secrets.AEGIS_RT_CLIENT_SECRET }} # fallback only; unset when federated
        run: python3 redteam/get_token.py
      - name: promptfoo suite
        shell: bash
        timeout-minutes: 12
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          npx --yes "promptfoo@${PROMPTFOO_VERSION}" eval \
            --config redteam/promptfoo/promptfooconfig.yaml \
            --no-cache --no-share --no-table --output redteam/results/promptfoo.json 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env AEGIS_STAGING_URL
      - name: gateway token for garak
        env:
          AEGIS_RT_TOKEN_URL: ${{ secrets.AEGIS_RT_TOKEN_URL }}
          AEGIS_RT_CLIENT_ID: ${{ secrets.AEGIS_RT_CLIENT_ID }}
          AEGIS_RT_ASSERTION_AUDIENCE: ${{ secrets.AEGIS_RT_ASSERTION_AUDIENCE }}
          AEGIS_RT_CLIENT_SECRET: ${{ secrets.AEGIS_RT_CLIENT_SECRET }} # fallback only; unset when federated
        run: python3 redteam/get_token.py
      - name: garak suite
        shell: bash
        timeout-minutes: 12
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          export OPENAICOMPATIBLE_API_KEY="${AEGIS_REDTEAM_KEY}"
          # garak opens its report file but never creates the directory.
          mkdir -p "${RUNNER_TEMP}/garak"
          # garak drops a 400 as a failed call, so guard blocks never reached the score. The
          # loopback adapter turns a guard block into a "[BLOCKED]" completion and passes
          # everything else through; gate.py fails a family whose attempts went unscored (#188).
          python3 redteam/garak/block_adapter.py \
            --port-file "${RUNNER_TEMP}/adapter.port" --stats "${RUNNER_TEMP}/garak/adapter-stats.json" &
          adapter_pid=$!
          trap 'kill "${adapter_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do [ -s "${RUNNER_TEMP}/adapter.port" ] && break; sleep 0.1; done
          [ -s "${RUNNER_TEMP}/adapter.port" ] || { echo "::error::block adapter did not start"; exit 1; }
          AEGIS_STAGING_URL="http://127.0.0.1:$(cat "${RUNNER_TEMP}/adapter.port")" \
            python3 redteam/garak/render_generator.py > "${RUNNER_TEMP}/garak-generator.json"
          python3 -m garak --config redteam/garak/aegisx9.yaml \
            --target_type openai.OpenAICompatible --target_name "${AEGIS_REDTEAM_MODEL}" \
            --generator_option_file "${RUNNER_TEMP}/garak-generator.json" \
            --report_prefix "${RUNNER_TEMP}/garak/aegisx9" 2>&1 \
            | python3 scripts/ci/redact_log.py --mask-env AEGIS_STAGING_URL
          kill "${adapter_pid}" 2>/dev/null || echo "::error::the block adapter exited before garak finished"
          wait "${adapter_pid}" || true
          stats="${RUNNER_TEMP}/garak/adapter-stats.json"
          [ -f "$stats" ] && echo "gateway responses seen by garak: $(cat "$stats")"
          python3 redteam/garak/gate.py \
            --report "${RUNNER_TEMP}/garak/aegisx9.report.jsonl" \
            --thresholds redteam/garak/thresholds.json
      # garak catches failed model calls and exits 0; its own log holds the reason.
      - name: garak log on failure
        if: failure()
        shell: bash
        run: |
          f="${HOME}/.local/share/garak/garak.log"
          [ -f "$f" ] || exit 0
          grep -E 'ERROR|WARNING|Error|Exception' "$f" | tail -n 30 \
            | python3 scripts/ci/redact_log.py --mask-env AEGIS_STAGING_URL --mask-env AEGIS_REDTEAM_KEY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: redteam-results
          path: |
            redteam/results/
            ${{ runner.temp }}/garak/
          retention-days: 30
