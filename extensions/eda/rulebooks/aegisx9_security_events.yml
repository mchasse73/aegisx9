---
# Event-Driven Ansible: react to AegisX9 gateway security alerts.
# Source: Alertmanager webhooks from the Loki ruler (see deploy/observability/).
- name: AegisX9 security events
  hosts: all
  sources:
    - name: Alertmanager
      ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5000
        data_alerts_path: alerts
        data_host_path: ""
    # Break-glass events from laptops (workspace/breakglass/bin). In the automation
    # controller this source is swapped for the "AegisX9 break-glass" event stream, whose
    # HMAC credential verifies X-AegisX9-Signature (sha256, hex, prefix "sha256="). The key
    # is never in this file: stand-alone runs pass it with --env-vars AEGISX9_EVENT_HMAC.
    - name: Break-glass event stream
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
        hmac_secret: "{{ AEGISX9_EVENT_HMAC }}"
        hmac_header: X-AegisX9-Signature
        hmac_algo: sha256
        hmac_format: hex
        hmac_signature_prefix: "sha256="
  rules:
    - name: Repeated prompt injection from one principal
      condition: >-
        event.alert.labels.alertname == "AegisX9RepeatedInjection"
        and event.alert.status == "firing"
      throttle:
        once_within: 15 minutes
        group_by_attributes:
          - event.alert.labels.principal
      action:
        run_job_template:
          name: "AegisX9 - Revoke agent key"
          organization: AegisX9
          job_args:
            extra_vars:
              incident_principal: "{{ event.alert.labels.principal }}"
              incident_environment: "{{ event.alert.labels.environment }}"
              incident_reason: repeated prompt-injection attempts

    - name: Audit signing failures
      condition: >-
        event.alert.labels.alertname == "AegisX9AuditSigningFailed"
        and event.alert.status == "firing"
      action:
        run_job_template:
          name: "AegisX9 - Collect audit evidence"
          organization: AegisX9
          job_args:
            extra_vars:
              audit_evidence_environment: "{{ event.alert.labels.environment }}"

    - name: Break-glass window opened
      condition: event.payload.event == "breakglass_activation"
      actions:
        - run_job_template:
            name: "AegisX9 - Break-glass record"
            organization: AegisX9
            job_args:
              extra_vars:
                breakglass_event: activation
                breakglass_activation_id: "{{ event.payload.activation_id }}"
                breakglass_who: "{{ event.payload.who }}"
                breakglass_started_at: "{{ event.payload.started_at }}"
                breakglass_expires_at: "{{ event.payload.expires_at }}"
                breakglass_window_hours: "{{ event.payload.window_hours }}"
                breakglass_device: "{{ event.payload.device }}"
        # The expiry timer: waits until expires_at, then revokes the window token by its
        # accessor whether or not the developer ran handoff-sync.
        - run_job_template:
            name: "AegisX9 - Break-glass window"
            organization: AegisX9
            job_args:
              extra_vars:
                breakglass_activation_id: "{{ event.payload.activation_id }}"
                breakglass_who: "{{ event.payload.who }}"
                breakglass_expires_at: "{{ event.payload.expires_at }}"
                breakglass_token_accessor: "{{ event.payload.token_accessor }}"

    - name: Break-glass sync completed
      condition: event.payload.event == "breakglass_sync"
      action:
        run_job_template:
          name: "AegisX9 - Break-glass record"
          organization: AegisX9
          job_args:
            extra_vars:
              breakglass_event: sync
              breakglass_activation_id: "{{ event.payload.activation_id }}"
              breakglass_who: "{{ event.payload.who }}"
              breakglass_result: "{{ event.payload.result }}"
              breakglass_files: "{{ event.payload.files | default(0) }}"
              breakglass_bytes: "{{ event.payload.bytes | default(0) }}"
              breakglass_revoked: "{{ event.payload.revoked | default(false) }}"

# External vantage scanner events (scanner/ in this repository). The scanner POSTs a
# JSON body signed with HMAC-SHA256 in `X-AegisX9-Signature: sha256=<hex>`; the webhook
# source verifies the signature before any rule sees the event. SCANNER_WEBHOOK_SECRET is
# injected by the automation controller as an EDA credential/variable, never a literal.
- name: AegisX9 external vantage events
  hosts: all
  sources:
    - name: Scanner webhook
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5002
        hmac_secret: "{{ SCANNER_WEBHOOK_SECRET }}"
        hmac_algo: sha256
        hmac_header: X-AegisX9-Signature
        hmac_format: hex
        hmac_signature_prefix: "sha256="
  rules:
    - name: Exposure change observed from the internet
      condition: >-
        event.payload.source == "aegisx9-scanner"
        and event.payload.event == "exposure_change"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.payload.event
      action:
        run_job_template:
          name: "AegisX9 - Exposure change"
          organization: AegisX9
          job_args:
            extra_vars:
              exposure_change_reason: external exposure change
              exposure_change_run_id: "{{ event.payload.run_id }}"
              exposure_change_summary: "{{ event.payload.summary }}"
              exposure_change_report_path: "{{ event.payload.report_path }}"

    - name: Public endpoint down
      condition: >-
        event.payload.source == "aegisx9-scanner"
        and event.payload.event == "down"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.payload.event
      action:
        run_job_template:
          name: "AegisX9 - Exposure change"
          organization: AegisX9
          job_args:
            extra_vars:
              exposure_change_reason: public endpoint down
              exposure_change_run_id: "{{ event.payload.run_id }}"
              exposure_change_summary: "{{ event.payload.summary }}"
              exposure_change_report_path: "{{ event.payload.report_path }}"

    - name: External red-team regression
      condition: >-
        event.payload.source == "aegisx9-scanner"
        and event.payload.event == "redteam_regression"
      throttle:
        once_within: 1 hour
        group_by_attributes:
          - event.payload.event
      action:
        run_job_template:
          name: "AegisX9 - Exposure change"
          organization: AegisX9
          job_args:
            extra_vars:
              exposure_change_reason: external red-team regression
              exposure_change_run_id: "{{ event.payload.run_id }}"
              exposure_change_summary: "{{ event.payload.summary }}"
              exposure_change_report_path: "{{ event.payload.report_path }}"

    # A clean run is recorded in the activation log (the evidence that the vantage
    # looked and found nothing new); nothing to do.
    - name: Clean scan recorded
      condition: >-
        event.payload.source == "aegisx9-scanner"
        and event.payload.event == "clean"
      action:
        debug:
          msg: "external vantage clean: run {{ event.payload.run_id }} ({{ event.payload.mode }}): {{ event.payload.summary }}"
