[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aegisx9"
dynamic = ["version"]
description = "Secure AI gateway with governance: guard pipeline, audit schema and policy for an LLM proxy."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Michael Chasse" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.1",
  "mypy==1.18.2",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/aegisx9"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Break-glass tools are Python scripts without a .py suffix; lint and format them too.
extend-include = ["workspace/breakglass/bin/handoff-sync", "workspace/breakglass/bin/aegisx9-event"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:scripts/ci"
files = [
  "src/aegisx9",
  "scripts/ci",
  "workspace/breakglass/bin/handoff-sync",
  "workspace/breakglass/bin/aegisx9-event",
]
scripts_are_modules = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aegisx9 --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["aegisx9"]
