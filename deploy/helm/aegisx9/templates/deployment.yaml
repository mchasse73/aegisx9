apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "aegisx9.fullname" . }}
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "aegisx9.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aegisx9.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aegisx9.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "aegisx9.podSecurityContext" . | nindent 8 }}
      containers:
        - name: gateway
          image: {{ include "aegisx9.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/aegisx9/config.yaml", "--port", "{{ .Values.service.port }}"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            {{- if .Values.gateway.oidc.enabled }}
            {{- /* When jwksUrl is empty the URL comes from the existing Secret (envFrom below),
                   so identity-provider details never need to be committed. */}}
            {{- if .Values.gateway.oidc.jwksUrl }}
            - name: JWT_PUBLIC_KEY_URL
              value: {{ .Values.gateway.oidc.jwksUrl | quote }}
            {{- end }}
            - name: JWT_AUDIENCE
              value: {{ .Values.gateway.oidc.audience | quote }}
            {{- end }}
            {{- if .Values.gateway.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.gateway.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.gateway.otel.serviceName | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          securityContext:
            {{- include "aegisx9.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/aegisx9
              readOnly: true
            - name: tmp
              mountPath: /tmp
        {{- if .Values.wif.enabled }}
        # Anthropic Workload Identity Federation broker (ADR 0009). It alone logs in to
        # Vault, fetches a fresh Vault-signed identity token per exchange and holds the
        # Anthropic access token; LiteLLM reaches Anthropic only through its loopback
        # listener. Probes are exec-based because the listener is bound to 127.0.0.1 and the
        # kubelet probes the pod IP.
        - name: wif-broker
          image: {{ include "aegisx9.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "aegisx9.wif_broker"]
          env:
            - name: AEGISX9_WIF_IDENTITY_SOURCE
              value: vault
            {{- if .Values.wif.vaultAddr }}
            - name: VAULT_ADDR
              value: {{ .Values.wif.vaultAddr | quote }}
            {{- else }}
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: VAULT_ADDR
            {{- end }}
            {{- if .Values.wif.vaultCaSecretKey }}
            - name: VAULT_CACERT
              value: /etc/aegisx9-vault-ca/ca.crt
            {{- end }}
            # Vault role, identity-token path and auth mount come from the Secret by
            # default (kept out of the public repository). A missing key keeps the pod
            # from starting, and the broker refuses to run without them.
            {{- if .Values.wif.vaultRole }}
            - name: AEGISX9_VAULT_ROLE
              value: {{ .Values.wif.vaultRole | quote }}
            {{- else }}
            - name: AEGISX9_VAULT_ROLE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WIF_VAULT_ROLE
            {{- end }}
            {{- if .Values.wif.vaultTokenPath }}
            - name: AEGISX9_VAULT_TOKEN_PATH
              value: {{ .Values.wif.vaultTokenPath | quote }}
            {{- else }}
            - name: AEGISX9_VAULT_TOKEN_PATH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WIF_VAULT_TOKEN_PATH
            {{- end }}
            {{- if .Values.wif.vaultAuthPath }}
            - name: AEGISX9_VAULT_AUTH_PATH
              value: {{ .Values.wif.vaultAuthPath | quote }}
            {{- else }}
            - name: AEGISX9_VAULT_AUTH_PATH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: WIF_VAULT_AUTH_PATH
            {{- end }}
            - name: AEGISX9_VAULT_K8S_JWT_FILE
              value: /var/run/secrets/vault/token
            - name: AEGISX9_WIF_LISTEN_PORT
              value: {{ .Values.wif.port | quote }}
            - name: AEGISX9_WIF_UPSTREAM
              value: {{ .Values.wif.upstream | quote }}
            - name: AEGISX9_WIF_REFRESH_FRACTION
              value: {{ .Values.wif.refreshFraction | quote }}
            - name: ANTHROPIC_FEDERATION_RULE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ANTHROPIC_FEDERATION_RULE_ID
            - name: ANTHROPIC_ORGANIZATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ANTHROPIC_ORGANIZATION_ID
            - name: ANTHROPIC_SERVICE_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ANTHROPIC_SERVICE_ACCOUNT_ID
            - name: ANTHROPIC_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: ANTHROPIC_WORKSPACE_ID
                  optional: true
          securityContext:
            {{- include "aegisx9.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ .Values.wif.port }}/healthz', timeout=2)"
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', {{ .Values.wif.port }}), 2).close()"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.wif.resources | nindent 12 }}
          volumeMounts:
            - name: vault-identity
              mountPath: /var/run/secrets/vault
              readOnly: true
            {{- if .Values.wif.vaultCaSecretKey }}
            - name: vault-ca
              mountPath: /etc/aegisx9-vault-ca
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aegisx9.fullname" . }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.wif.enabled }}
        # Short-lived service-account token for Vault's Kubernetes auth method, mounted only
        # into the broker. The gateway container never sees it.
        - name: vault-identity
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  {{- with .Values.wif.vaultAudience }}
                  audience: {{ . | quote }}
                  {{- end }}
                  expirationSeconds: {{ .Values.wif.vaultTokenExpirationSeconds }}
                  path: token
        {{- with .Values.wif.vaultCaSecretKey }}
        # Vault's CA certificate (PEM) from the gateway Secret; TLS is always verified.
        - name: vault-ca
          secret:
            secretName: {{ $.Values.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ . }}
                path: ca.crt
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $nodeExprs := list }}
      {{- if .Values.scheduling.avoidControlPlane }}
      {{- $nodeExprs = append $nodeExprs (dict "key" "node-role.kubernetes.io/control-plane" "operator" "DoesNotExist") }}
      {{- end }}
      {{- if .Values.scheduling.excludeNodeHostnames }}
      {{- $nodeExprs = append $nodeExprs (dict "key" "kubernetes.io/hostname" "operator" "NotIn" "values" .Values.scheduling.excludeNodeHostnames) }}
      {{- end }}
      {{- $affinity := deepCopy (default dict .Values.affinity) }}
      {{- if $nodeExprs }}
      {{- $_ := set $affinity "nodeAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (dict "nodeSelectorTerms" (list (dict "matchExpressions" $nodeExprs)))) }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
