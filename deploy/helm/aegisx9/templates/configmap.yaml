{{- if and (not .Values.wif.enabled) (gt (len (include "aegisx9.wifModels" . | fromJsonArray)) 0) }}
{{- fail "gateway.models has wif: true entries but wif.enabled is false" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "aegisx9.fullname" . }}-config
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
    {{- range .Values.gateway.models }}
      - model_name: {{ .name }}
        litellm_params:
          model: {{ .model }}
          {{- if .wif }}
          # Reached only through the loopback federation broker, which replaces this
          # placeholder with a short-lived access token. LiteLLM requires a non-empty key.
          api_base: http://127.0.0.1:{{ $.Values.wif.port }}
          api_key: unused-placeholder-not-a-secret
          anthropic_disable_workload_identity_federation: true
          {{- else }}
          api_key: os.environ/{{ .apiKeyEnv }}
          {{- end }}
          rpm: {{ .rpm }}
          max_tokens: {{ .maxTokens }}
    {{- end }}
    litellm_settings:
      callbacks: ["{{ .Values.gateway.guards.callback }}"]
      drop_params: true
      turn_off_message_logging: true
      redact_messages_in_exceptions: true
      # Proxy-wide budget across every caller (LiteLLM reads it from litellm_settings).
      max_budget: {{ .Values.gateway.budgets.proxyMaxBudgetUsd }}
      budget_duration: {{ .Values.gateway.budgets.budgetDuration }}
      {{- if .Values.gateway.otel.enabled }}
      success_callback: ["otel"]
      failure_callback: ["otel"]
      {{- end }}
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_spend_logs: false
      {{- if .Values.gateway.oidc.enabled }}
      enable_jwt_auth: true
      litellm_jwtauth:
        user_id_jwt_field: {{ .Values.gateway.oidc.userIdClaim | quote }}
        team_ids_jwt_field: {{ .Values.gateway.oidc.teamIdClaim | quote }}
        user_id_upsert: true
      {{- end }}
