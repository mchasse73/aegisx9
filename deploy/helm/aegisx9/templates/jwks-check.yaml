{{- if and .Values.wif.enabled .Values.wif.jwksCheck.enabled }}
{{- $fullname := include "aegisx9.fullname" . }}
# The Anthropic federation issuer holds the public keys that sign the gateway's identity
# tokens inline. When the store rotates the signing key, every exchange fails until the new
# public key is uploaded, so this job checks that every key id in wif.uploadedKids is still
# published at the unauthenticated identity/oidc/.well-known/keys endpoint and logs an
# aegisx9_jwks line (missing_uploaded_kids) that the Loki rules alert on. The endpoint
# also lists unrelated keys that rotate daily, so the published set is never compared whole.
apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ $fullname }}-jwks-check
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_31=seccomp RuntimeDefault is set at pod and container level; the pinned Checkov does not detect it on Job/CronJob
spec:
  schedule: {{ .Values.wif.jwksCheck.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "aegisx9.opsSelectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "aegisx9.serviceAccountName" . }}
          automountServiceAccountToken: false
          {{- with .Values.opsJobs.priorityClassName }}
          priorityClassName: {{ . }}
          {{- end }}
          securityContext:
            {{- include "aegisx9.podSecurityContext" . | nindent 12 }}
          containers:
            - name: check-jwks
              image: {{ include "aegisx9.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "aegisx9.gateway_ops", "check-jwks"]
              env:
                {{- if .Values.wif.vaultAddr }}
                - name: VAULT_ADDR
                  value: {{ .Values.wif.vaultAddr | quote }}
                {{- else }}
                - name: VAULT_ADDR
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: VAULT_ADDR
                {{- end }}
                {{- if .Values.wif.vaultCaSecretKey }}
                - name: VAULT_CACERT
                  value: /etc/aegisx9-vault-ca/ca.crt
                {{- end }}
                - name: AEGISX9_WIF_UPLOADED_KIDS
                  value: {{ join "," .Values.wif.uploadedKids | quote }}
              securityContext:
                {{- include "aegisx9.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.gateway.budgets.jobs.resources | nindent 16 }}
              {{- if .Values.wif.vaultCaSecretKey }}
              volumeMounts:
                - name: vault-ca
                  mountPath: /etc/aegisx9-vault-ca
                  readOnly: true
              {{- end }}
          {{- with .Values.wif.vaultCaSecretKey }}
          volumes:
            - name: vault-ca
              secret:
                secretName: {{ $.Values.existingSecret }}
                defaultMode: 0440
                items:
                  - key: {{ . }}
                    path: ca.crt
          {{- end }}
{{- end }}
