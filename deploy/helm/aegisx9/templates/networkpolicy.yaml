{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "aegisx9.fullname" . }}
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisx9.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
          protocol: TCP
    # Budget jobs call the admin API (gateway_ops).
    - from:
        - podSelector:
            matchLabels:
              {{- include "aegisx9.opsSelectorLabels" . | nindent 14 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # OpenTelemetry collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelNamespace }}
      ports:
        - { port: 4318, protocol: TCP }
    # Model providers and the identity provider's JWKS endpoint (HTTPS only)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egressCidr }}
            except:
              {{- toYaml .Values.networkPolicy.egressExceptCidrs | nindent 14 }}
      ports:
        - { port: 443, protocol: TCP }
    {{- if and .Values.wif.enabled .Values.networkPolicy.vaultNamespace }}
    # Vault (Kubernetes auth login and identity tokens for the federation broker)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.vaultNamespace }}
      ports:
        - port: {{ .Values.networkPolicy.vaultPort }}
          protocol: TCP
    {{- end }}
---
# Day-2 jobs (budget bootstrap, spend and JWKS checks): DNS, the gateway and, when
# vaultNamespace is set, Vault for the JWKS check. No ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "aegisx9.fullname" . }}-ops
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisx9.opsSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              {{- include "aegisx9.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    {{- with .Values.networkPolicy.vaultNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ $.Values.networkPolicy.vaultPort }}
          protocol: TCP
    {{- end }}
{{- end }}
