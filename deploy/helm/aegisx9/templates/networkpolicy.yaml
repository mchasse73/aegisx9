{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "aegisx9.fullname" . }}
  labels:
    {{- include "aegisx9.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aegisx9.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # Cluster DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # OpenTelemetry collector
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.otelNamespace }}
      ports:
        - { port: 4318, protocol: TCP }
    # Model providers and the identity provider's JWKS endpoint (HTTPS only)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egressCidr }}
            except:
              {{- toYaml .Values.networkPolicy.egressExceptCidrs | nindent 14 }}
      ports:
        - { port: 443, protocol: TCP }
{{- end }}
