replicaCount: 1
gateway:
  # Claude models through the federation broker (ADR 0009): no provider key anywhere.
  models:
    - name: claude-sonnet-5-5
      model: anthropic/claude-sonnet-5-5
      wif: true
      rpm: 60
      maxTokens: 4096
    - name: claude-haiku-5-5
      model: anthropic/claude-haiku-5-5
      wif: true
      rpm: 120
      maxTokens: 4096
    - name: claude-opus-5-5
      model: anthropic/claude-opus-5-5
      wif: true
      rpm: 20
      maxTokens: 4096
  budgets:
    # The owner's Anthropic credits are $200/month; the gateway stops at $180 per 30 days.
    proxyMaxBudgetUsd: 180
    budgetDuration: 30d
    # $20 + $30 + $75 + $40 allocated; the remaining $15 is deliberately unallocated headroom.
    # Applied by the budget bootstrap Job after each sync.
    consumers:
      - teamId: public-chat
        alias: Public chat
        maxBudgetUsd: 20
        models: [claude-haiku-5-5]
        defaultModel: claude-haiku-5-5
      - teamId: staging-tests
        alias: Staging tests and red-team
        maxBudgetUsd: 30
        models: [claude-haiku-5-5, claude-sonnet-5-5]
        defaultModel: claude-haiku-5-5
      # $25 per developer; the team cap covers three developers (the Coder quota). Raise it
      # (within the unallocated headroom) when a developer joins. Opus is served only when a developer
      # asks for it by name; "default" resolves to Sonnet.
      - teamId: developers
        alias: Developers
        maxBudgetUsd: 75
        memberBudgetUsd: 25
        models: [claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5]
        defaultModel: claude-sonnet-5-5
      # A weekly headless scout agent on a host cron (#203). Its identity is a federated
      # 15-minute token (issuer #3, pending); no static key.
      - teamId: pass-income
        alias: Pass-income scout
        maxBudgetUsd: 40
        models: [claude-sonnet-5-5, claude-haiku-5-5]
        defaultModel: claude-sonnet-5-5
    jobs:
      enabled: true
  # Short-lived JWT login (ADR 0010, #86): the auth sidecar validates identity-provider
  # access tokens (15 minutes, asymmetric signature) and exchanges each for a virtual key
  # that expires with it. Issuer, JWKS URL, audience and the group-to-team mapping all come
  # from the aegisx9-gateway Secret, so no identity-provider detail lives in the overlay.
  oidc:
    enabled: true
    issuers:
      - name: idp
        issuerEnv: AEGIS_JWT_ISSUER
        jwksUrlEnv: AEGIS_JWT_JWKS_URL
        audienceEnv: AEGIS_JWT_AUDIENCE
        groupTeamsEnv: AEGIS_JWT_GROUP_TEAMS
        userClaim: sub
        groupsClaim: groups
        maxLifetimeSeconds: 900
      # The red-team job's machine identity (#147): a token minted from the job's own GitHub
      # Actions OIDC token, accepted by the identity provider only for this repository's
      # main-branch red-team workflow; its group maps to the staging-tests team.
      - name: redteam
        issuerEnv: AEGIS_RT_JWT_ISSUER
        jwksUrlEnv: AEGIS_RT_JWT_JWKS_URL
        audienceEnv: AEGIS_RT_JWT_AUDIENCE
        groupTeamsEnv: AEGIS_RT_JWT_GROUP_TEAMS
        userClaim: sub
        groupsClaim: groups
        maxLifetimeSeconds: 900
    # Limits sized so a rolling update fits the namespace quota (limits.cpu 3): two pods at
    # 1.3 CPU each (gateway 800m, auth 400m, broker 100m) plus the budget Job and one CronJob.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 400m
        memory: 128Mi
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 800m
    memory: 1Gi
opsJobs:
  priorityClassName: aegisx9-low
wif:
  enabled: true
  # VAULT_ADDR, Vault's CA certificate and the Vault role, identity-token path and auth
  # mount (WIF_VAULT_*) all come from the aegisx9-gateway Secret.
  vaultCaSecretKey: VAULT_CACERT_PEM
  # Key id of the public key uploaded to the federation issuer on 2026-10-22. Before the
  # signing key rotates, upload the new public key to the issuer and add its kid here.
  uploadedKids: ["e499d095-5727-55e0-9155-d31a96f45192"]
  jwksCheck:
    enabled: true
# NetworkPolicies, like the namespace and quota, are owned by the platform team and
# excluded from the Argo CD AppProject; the chart must not render one here.
networkPolicy:
  enabled: false
