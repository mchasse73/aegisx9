# The gateway's runtime Secret, synced by External Secrets from the secrets store.
# Values are never in Git: the master key and salt are generated into the store, the
# provider key and the identity provider's JWKS URL are written there by the owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aegisx9-gateway
  namespace: aegisx9-staging
  labels:
    app.kubernetes.io/part-of: aegisx9
    aegisx9.io/environment: staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: aegisx9-gateway
    creationPolicy: Owner
    template:
      type: Opaque
  dataFrom:
    - extract:
        key: aegisx9/staging/gateway
