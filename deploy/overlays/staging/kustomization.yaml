# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # v0.6.0: the signed digest from the release workflow for main a8bffc2 (2026-11-04), the
    # same index the 0.6.0 tag points at (tag run verified main's signatures, then re-tagged).
    # Adds the embedded-instruction and instruction-echo guards (#179, #195, ADR 0024).
    digest: sha256:12de72258227af5e85f97d2b68b6e0b1279a452b9e037608779de2c640b6141e
