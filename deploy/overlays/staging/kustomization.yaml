# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # v0.5.0: the signed digest from the release workflow for main 35e8b7e (2026-11-03), the
    # same index the 0.5.0 tag points at (tag run verified main's signatures, then re-tagged).
    # Guard blocks answer 400 invalid_request_error instead of 500 (#171).
    digest: sha256:f6b1ffefa8d225c3ad173d6792468c6d853d1494594938aa7d8d0e3666706c8f
