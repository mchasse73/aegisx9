# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # v0.3.1: the signed digest from the release workflow for main 6f487be (2026-10-28), the
    # same index the 0.3.1 tag points at. Brings the auth sidecar (ADR 0010) enabled below.
    digest: sha256:77a9b1bd963cee95dacf10404972a353e6aa54bd612ab97362f48422ff58c62e
