# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # v0.6.1: the signed digest from the release workflow for main 2e562ea (2026-11-19), the
    # same index the 0.6.1 tag points at (tag run verified main's signatures, then re-tagged).
    # UUID fix in the encoded guard (#210), LiteLLM 1.109.1, node 26 (#222), CVE fixes (#220).
    digest: sha256:5ec7209789734d870dd19fbd45ef9529ea1970689f740aea2e387583dea9a754
