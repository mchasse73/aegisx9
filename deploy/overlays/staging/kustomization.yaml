# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # Signed digest (legacy cosign layout) from the release workflow for main 8c10c78 (2026-10-22):
    # contains the federation broker and the budget jobs.
    digest: sha256:9c3a3e0832f5212d7c5f5aa42e2c0aeb7e73cb20fe344e58fdef6647ae01c075
