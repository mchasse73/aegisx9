# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # Signed digest (legacy cosign layout) from the release workflow for main 95989c8 (2026-10-22):
    # Prisma baked in for the budget database; key-id based signing-key check.
    digest: sha256:25d3f297f9e52e7194a1c8c3c06020d296e3c23515fe7c303d04e6bdae7baf9c
