# Argo CD renders this with `kustomize build --enable-helm`.
# Promotion = a PR that changes images[].digest below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisx9-staging
# The namespace, its quota and NetworkPolicies are owned by the platform team and are
# excluded from this Application; the overlay only renders the chart into it.
resources:
  - externalsecret.yaml
helmGlobals:
  chartHome: ../../helm
helmCharts:
  - name: aegisx9
    releaseName: aegisx9
    namespace: aegisx9-staging
    valuesFile: values.yaml
images:
  - name: ghcr.io/mchasse73/aegisx9
    # v0.4.0: the signed digest from the release workflow for main 66f664b (2026-10-29), the
    # same index the 0.4.0 tag points at. Brings the auth sidecar (ADR 0010) enabled below.
    digest: sha256:375c1d87235d6d95669154ced15f1f7bda54042d5c24d8957b3cc5b146aed30d
