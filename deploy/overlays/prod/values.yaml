replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
gateway:
  oidc:
    # Set to the identity provider's JWKS URL for the production application.
    jwksUrl: ""
  budgets:
    defaultMaxBudgetUsd: 20
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: aegisx9
