---
ancestor: null
releases:
  0.4.1:
    changes:
      trivial:
        - >-
          No changes to the collection's roles; version aligned with the AegisX9 release
          (developer login CLI, scanner volume tags at launch, ADRs 0015-0020).
    release_date: "2026-10-29"
  0.4.0:
    changes:
      trivial:
        - >-
          No changes to the collection's roles; version aligned with the AegisX9 release
          (auth sidecar configuration from the Secret, scope ADRs 0011-0014).
    release_date: "2026-10-29"
  0.3.1:
    changes:
      bugfixes:
        - >-
          scanner role - with scanner_package_ref v0.3.1 the webhook URL parameter is optional:
          absent means webhook alerts off and email only, so the scan units start before an
          Event-Driven Ansible receiver exists (aegisx9 GitHub issue 102).
    release_date: "2026-10-28"
  0.3.0:
    changes:
      breaking_changes:
        - >-
          scanner role - scanner_package_ref has no default any more and must name a release
          tag (vX.Y.Z) or a full commit SHA that contains the scanner fixes.
      bugfixes:
        - >-
          scanner role - PEP 508 package install, CPU-only torch under a constraints pin, one
          package build per deploy, replaces CUDA torch and git-less builds, and restarts the
          secrets fetcher when it changes (aegisx9 GitHub issue 96).
    release_date: "2026-10-28"
  0.2.0:
    changes:
      minor_changes:
        - breakglass role, "Break-glass record" and "Break-glass window" playbooks for the local break-glass workspace events.
    release_date: "2026-10-21"
  0.1.0:
    changes:
      major_changes:
        - Initial roles for provider-key rotation, gateway upgrade, audit evidence and incident response.
      minor_changes:
        - New scanner role (external vantage host over SSM Session Manager) and exposure_change role (incident record for scanner webhook events).
    release_date: "2026-10-21"
