---
- name: Validate the pseudonymous principal from the event
  ansible.builtin.assert:
    that:
      - incident_principal is match('^[0-9a-f]{16}$')
    fail_msg: incident_principal must be the 16-hex pseudonymous id from the audit event
    quiet: true

- name: Block the principal's gateway keys (LiteLLM admin API)
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'AEGISX9_GATEWAY_URL') }}/key/block"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AEGISX9_GATEWAY_ADMIN_KEY') }}"
    body_format: json
    body:
      user_id: "{{ incident_principal }}"
    status_code: [200, 404]
  no_log: true

- name: Open an incident record
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ incident_repository }}/issues"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AEGISX9_GITHUB_TOKEN') }}"
      Accept: application/vnd.github+json
    body_format: json
    body:
      title: "[{{ incident_environment }}] Agent key blocked: {{ incident_reason }}"
      body: |
        Principal (pseudonymous): {{ incident_principal }}
        Action taken: gateway keys blocked by Event-Driven Ansible.
        Next steps: review signed audit records for this principal, confirm, then rotate or restore.
      labels: [incident, area/guards]
    status_code: 201
  no_log: true
