---
# The scanner host is reached over AWS Systems Manager Session Manager, never SSH:
# see automation/inventory/scanner.yml (community.aws.aws_ssm connection).
# Secrets never pass through this role: the host fetches them from the SSM Parameter
# Store at boot (aegisx9-scanner-env.service). This role only ships code and config.

# Release tag (vX.Y.Z) or full 40-character commit SHA of this repository to install the
# scanner package from. Required, no default: it must name a release that contains the
# bootstrap and unit fixes of issue #96. The role refuses to run until it is set.
scanner_package_ref: ""
scanner_venv: /opt/aegisx9-scanner/venv
# torch is installed from the CPU-only wheel index before garak, so pip never pulls the
# multi-gigabyte CUDA build (it filled a 16 GiB root volume). Keep in step with the
# torch_version Terraform variable in infra/scanner.
scanner_torch_version: "2.14.1"
scanner_torch_index_url: https://download.pytorch.org/whl/cpu
# Reinstall the scanner package even when the installed ref equals scanner_package_ref
# (only needed if a tag was moved; normally a deploy rebuilds only when the ref changes).
scanner_force_reinstall: false
scanner_config_dir: /etc/aegisx9-scanner
scanner_state_dir: /var/lib/aegisx9-scanner
# garak release installed next to the scanner for the weekly red-team unit. Keep this,
# scanner_torch_version and scanner_torch_index_url in step with the garak_version,
# torch_version and torch_index_url Terraform variables in infra/scanner.
scanner_garak_version: "0.17.1"
# Red-team suites (promptfoo + garak configs) shipped from the project checkout.
scanner_redteam_src_dir: "{{ playbook_dir }}/../../redteam"
scanner_redteam_dir: /opt/aegisx9-scanner/redteam

# Where the systemd units ship in the project checkout (AAP project = this repository).
scanner_units_dir: "{{ playbook_dir }}/../../scanner/systemd"
scanner_units:
  - aegisx9-scanner-env.service
  - aegisx9-scan-daily.service
  - aegisx9-scan-daily.timer
  - aegisx9-scan-uptime.service
  - aegisx9-scan-uptime.timer
  - aegisx9-scan-redteam.service
  - aegisx9-scan-redteam.timer
scanner_timers:
  - aegisx9-scan-daily.timer
  - aegisx9-scan-uptime.timer
  - aegisx9-scan-redteam.timer

# Path (on the controller) to the approved-exposure registry. The file is maintained in
# the platform operations repository and is checked out next to this one by the AAP
# project; it is never embedded in this collection.
scanner_approved_registry_path: ""

# Scan targets: hostnames and CIDRs (rendered to targets.yml). Placeholders only here.
scanner_targets:
  hosts:
    - www.example.com
  cidrs:
    - 203.0.113.0/27
  dns: []
  uptime:
    - url: https://www.example.com/
      expect_status: 200
      max_latency_ms: 3000

# Never-target deny list (rendered to never_target.yml). Live-trading endpoints and
# anything else that must never be scanned or loaded. Checked before every scan.
scanner_never_target:
  hostnames: []
  cidrs: []
  patterns:
    - "*.trading.example.com"
