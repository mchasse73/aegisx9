# AegisX9 workspace sshd policy. The image never starts sshd itself: the Coder agent's
# startup script starts it as `dev`, unprivileged, on a loopback port, with host keys
# kept on the home volume (so they are NOT generated in the image; the script passes
# `-h <path>`), and the sync tool connects over it as user `dev`. This drop-in applies
# whenever sshd reads the system config; a script that passes `-f` must carry it over.
Port 2222
ListenAddress 127.0.0.1
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
AllowUsers dev
PidFile none
